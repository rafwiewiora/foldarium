name: Pipeline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts-and-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test portable pipeline core
        env:
          PYTHONPATH: pipeline/src
        run: python -m unittest discover -s pipeline/tests -v
