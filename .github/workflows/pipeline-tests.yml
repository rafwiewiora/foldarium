name: Test and audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    name: web-contracts-node${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Test web application and API contracts
        run: npm test

  contracts-and-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Test portable pipeline core
        env:
          PYTHONPATH: pipeline/src
        run: python -m unittest discover -s pipeline/tests -v

  scientific-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install evaluation dependencies
        run: python -m pip install -e "./pipeline[evaluation]"
      - name: Test pipeline with scientific evaluators
        run: python -m unittest discover -s pipeline/tests -v
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install isolated PostgreSQL acceptance dependency
        run: npm install --prefix "$RUNNER_TEMP/foldarium-pglite" --no-save --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - name: Test vote provenance, scoped enrollment and composed lifecycle
        timeout-minutes: 5
        run: |
          node pipeline/tests/check_typed_retrospective_votes_database.mjs "$RUNNER_TEMP/foldarium-pglite/node_modules/@electric-sql/pglite/dist/index.js"
          node pipeline/tests/check_weekly_benchmark_scope.mjs "$RUNNER_TEMP/foldarium-pglite/node_modules/@electric-sql/pglite/dist/index.js"
          node pipeline/tests/check_weekly_lifecycle_acceptance.mjs "$RUNNER_TEMP/foldarium-pglite/node_modules/@electric-sql/pglite/dist/index.js" "$(command -v python)"

  selector-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Test offline Selector mapper
        run: cargo test --locked --manifest-path tools/weekly-selector-wasm/Cargo.toml
      - name: Test JavaScript parity fixture
        run: node --test tools/weekly-selector-wasm/tests/parity.test.js

  database-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase and apply migrations
        run: supabase start
      - name: Verify migrations replay cleanly
        run: supabase db reset

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml
          GITLEAKS_ENABLE_COMMENTS: "false"
