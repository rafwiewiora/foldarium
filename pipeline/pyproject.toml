[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "foldarium-pipeline"
version = "0.1.0"
description = "Portable, method-neutral prediction pipeline for Foldarium"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rafal Wiewiora" }]
dependencies = []

[project.urls]
Repository = "https://github.com/rafwiewiora/foldarium"
Issues = "https://github.com/rafwiewiora/foldarium/issues"

[project.optional-dependencies]
evaluation = [
  "gemmi==0.7.5",
  "numpy==2.3.2",
  "rdkit==2025.3.6",
]
interactions = [
  "prolif==2.2.0",
  "rdkit==2026.3.4",
]
weekly-llm = [
  "cursor-sdk==1.0.28",
]

[project.scripts]
foldarium-pipeline = "foldarium_pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/foldarium_pipeline"]
