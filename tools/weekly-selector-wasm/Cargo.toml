[package]
name = "weekly-selector-wasm"
version = "0.1.0"
edition = "2021"
description = "Offline Foldarium weekly selector submission mapper"
license = "MIT"
repository = "https://github.com/rafwiewiora/foldarium"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0.151", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.20"
uuid = { version = "1.19.0", features = ["serde"] }
wasm-bindgen = "0.2.127"

[dev-dependencies]
wasm-bindgen-test = "0.3.57"

[profile.release]
opt-level = "s"
lto = true
